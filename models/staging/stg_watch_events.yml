version: 2

models:
  - name: stg_watch_events
    description: >
      Staging view for WatchEvent (star) rows. Same column contract as the other
      staging models so int_events_deduped can union them directly.
    meta:
      owner: "@clyv"
      data_domain: developer_activity
      refresh_cadence: daily partition
    columns:
      - name: event_id
        description: GitHub event identifier. Not unique at this layer.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]+$"
                is_raw: true

      - name: occurred_at
        description: Event timestamp (UTC).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "'2020-01-01'"
                max_value: "'2030-12-31'"

      - name: actor_login
        description: GitHub username of the actor.
        tests:
          - mostly_not_null:
              arguments:
                threshold: 0.98

      - name: watch_action
        description: >
          Watch action from payload.action. Unlike pr_action this is safe to
          constrain -- the GitHub events API only ever emits "started" for
          WatchEvent.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["started"]

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
            max_value: 100000
