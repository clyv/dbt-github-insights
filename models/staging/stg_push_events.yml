version: 2

models:
  - name: stg_push_events
    description: >
      Typed staging view for PushEvent rows from local seed data (or BigQuery
      when cloud is enabled). Staging preserves the raw event stream as-is,
      duplicates included -- uniqueness is asserted downstream in
      int_events_deduped, after the midnight boundary dedupe runs.
    meta:
      owner: "@clyv"
      data_domain: developer_activity
      refresh_cadence: daily partition
    columns:
      - name: event_id
        description: GitHub event identifier. Not unique at this layer.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[0-9]+$"
                is_raw: true

      - name: occurred_at
        description: Event timestamp (UTC).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "'2020-01-01'"
                max_value: "'2030-12-31'"

      - name: actor_login
        description: >
          GitHub username of the actor. Deleted accounts and anonymised events
          leave this null in the real archive, so it is asserted
          probabilistically rather than with a hard not_null.
        tests:
          - mostly_not_null:
              arguments:
                threshold: 0.98

      - name: push_commit_count
        description: >
          Number of commits in the push (from payload.size). Force-push and
          import events produce genuine outliers, so the range is asserted
          probabilistically.
        tests:
          - mostly_between:
              arguments:
                min_value: 1
                max_value: 5000
                threshold: 0.995

    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 5
            max_value: 100000
