name: github_archive
version: 1.0.0
config-version: 2

profile: github_archive

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Single-day partition for MVP; extend via docs/exploration.md scope notes.
  partition_date: "20240101"
  exploration_start_date: "2024-01-01"
  exploration_end_date: "2024-03-31"

models:
  github_archive:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
